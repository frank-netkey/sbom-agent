name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh

      - name: Tests
        run: |
          if [ -f tests/run.sh ]; then
            bash tests/run.sh
          else
            echo "tests/run.sh not present; skipping"
          fi
